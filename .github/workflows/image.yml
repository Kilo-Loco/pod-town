name: Build image

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version tag (v1.2.3) publishes :v1.2.3, which Pod templates should pin.
      # A push to main publishes :latest for testing.
      - id: meta
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=$repo:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$repo:latest,$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
